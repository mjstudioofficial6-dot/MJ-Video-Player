name: Build and smoke-test MJ Video Player (separate APK)

on:
  workflow_dispatch:
  push:
    paths:
      - "MJ-Video-Player-source-Gradle-9.6.0-API36.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify and extract source ZIP
        run: |
          set -euo pipefail
          test -f MJ-Video-Player-source-Gradle-9.6.0-API36.zip
          unzip -t MJ-Video-Player-source-Gradle-9.6.0-API36.zip
          mkdir -p app-source
          unzip -q MJ-Video-Player-source-Gradle-9.6.0-API36.zip -d app-source
          test -f app-source/MJ-Video-Player/settings.gradle.kts
          test -f app-source/MJ-Video-Player/app/src/main/AndroidManifest.xml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "15859902"
          packages: "platform-tools"

      - name: Install Android API 36, Build Tools, and Emulator image
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" "emulator" "system-images;android-36;google_apis;x86_64"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Generate and verify Gradle Wrapper
        working-directory: app-source/MJ-Video-Player
        run: |
          set -euo pipefail
          gradle wrapper --gradle-version 9.6.0 --distribution-type bin
          ./gradlew wrapper --gradle-version 9.6.0 --distribution-type bin
          ./gradlew --version
          grep -q "gradle-9.6.0-bin.zip" gradle/wrapper/gradle-wrapper.properties
          test -f gradle/wrapper/gradle-wrapper.jar
          test -x gradlew

      - name: Build debug APK
        working-directory: app-source/MJ-Video-Player
        run: ./gradlew --no-daemon clean assembleDebug

      - name: Enable KVM hardware acceleration
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo 'ERROR: /dev/kvm is unavailable on the runner.'
            exit 1
          fi

      - name: Launch APK on Android 16 emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          working-directory: ${{ github.workspace }}
          api-level: 36
          system-image-api-level: 36
          target: default
          arch: x86_64
          avd-name: mj-api36
          cores: 2
          ram-size: 2048M
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            APP_DIR="$GITHUB_WORKSPACE/app-source/MJ-Video-Player"
            APK="$APP_DIR/app/build/outputs/apk/debug/app-debug.apk"
            AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
            test -f "$APK"
            test -x "$AAPT"

            adb wait-for-device
            BOOT_COMPLETED=""
            for attempt in $(seq 1 60); do
              BOOT_COMPLETED="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
              if [ "$BOOT_COMPLETED" = "1" ]; then
                break
              fi
              sleep 2
            done
            if [ "$BOOT_COMPLETED" != "1" ]; then
              echo "ERROR: Android emulator did not finish booting."
              exit 1
            fi

            PACKAGE="$("$AAPT" dump badging "$APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n 1)"
            if [ -z "$PACKAGE" ]; then
              echo "ERROR: Could not read the APK package name."
              exit 1
            fi

            mkdir -p "$APP_DIR"
            adb install -r "$APK"
            adb logcat -c
            adb shell monkey -p "$PACKAGE" -c android.intent.category.LAUNCHER 1
            sleep 15

            if ! adb shell pidof "$PACKAGE" >/dev/null 2>&1; then
              echo "ERROR: App process is not running after launch."
              adb logcat -d -v time > "$APP_DIR/smoke-test-logcat.txt"
              exit 1
            fi

            adb shell dumpsys activity activities > "$APP_DIR/activity-dump.txt"
            adb logcat -d -v time > "$APP_DIR/smoke-test-logcat.txt"
            if ! grep -Fq "$PACKAGE" "$APP_DIR/activity-dump.txt"; then
              echo "ERROR: App activity was not found in the activity dump."
              exit 1
            fi
            echo "PASS: $PACKAGE installed, launched, and remained running for 15 seconds."

      - name: Upload APK and generated wrapper
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MJ-Video-Player-APK-and-Gradle-Wrapper
          path: |
            app-source/MJ-Video-Player/app/build/outputs/apk/debug/app-debug.apk
            app-source/MJ-Video-Player/gradlew
            app-source/MJ-Video-Player/gradlew.bat
            app-source/MJ-Video-Player/gradle/wrapper/gradle-wrapper.jar
            app-source/MJ-Video-Player/gradle/wrapper/gradle-wrapper.properties
            app-source/MJ-Video-Player/activity-dump.txt
            app-source/MJ-Video-Player/smoke-test-logcat.txt
          if-no-files-found: warn
