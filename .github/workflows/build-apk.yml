name: Build MJ Video Player APK

on:
  workflow_dispatch:
  push:
    paths:
      - "MJ-Video-Player-source(2).zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and extract source ZIP
        run: |
          test -f MJ-Video-Player-source(2).zip
          unzip -t MJ-Video-Player-source(2).zip
          mkdir -p app-source
          unzip -q MJ-Video-Player-source(2).zip -d app-source
          test -f app-source/MJ-Video-Player/settings.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Generate and verify Gradle Wrapper
        working-directory: app-source/MJ-Video-Player
        run: |
          gradle wrapper --gradle-version 8.13
          ./gradlew --version

      - name: Build Debug APK
        working-directory: app-source/MJ-Video-Player
        run: ./gradlew --no-daemon clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MJ-Video-Player-debug-APK
          path: app-source/MJ-Video-Player/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
