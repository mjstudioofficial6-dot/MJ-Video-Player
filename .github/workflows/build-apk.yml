name: Build MJ Video Player APK

on:
  workflow_dispatch:
  push:
    paths:
      - "MJ-Video-Player-Source-Code.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check and extract Android source ZIP
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_ARCHIVE="MJ-Video-Player-Source-Code.zip"
          if [ ! -f "$SOURCE_ARCHIVE" ]; then
            echo "ERROR: $SOURCE_ARCHIVE was not found in the repository root."
            echo "Upload the Source Code ZIP to the root of the GitHub repository."
            exit 1
          fi
          unzip -t "$SOURCE_ARCHIVE"
          unzip -q -o "$SOURCE_ARCHIVE" -d "$GITHUB_WORKSPACE"
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle/wrapper/gradle-wrapper.properties
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          echo "Android source ZIP extracted successfully into the repository root."
          echo "Project files found:"
          ls -la

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "15859902"
          packages: "platform-tools"

      - name: Install Android API 36 and Build Tools 36.0.0
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Verify official Gradle 9.6.0 distribution checksum
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="bbaeb2fef8710818cf0e261201dab964c572f92b942812df0c3620d62a529a01"
          PUBLISHED="$(curl --fail --silent --show-error --location https://services.gradle.org/distributions/gradle-9.6.0-bin.zip.sha256)"
          test "$PUBLISHED" = "$EXPECTED"
          echo "Gradle 9.6.0 published checksum matches the pinned baseline."

      - name: Generate and verify genuine Gradle 9.6.0 Wrapper
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_SHA="bbaeb2fef8710818cf0e261201dab964c572f92b942812df0c3620d62a529a01"
          WRAPPER_SHA="497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7"
          curl --fail --silent --show-error --location \
            https://services.gradle.org/distributions/gradle-9.6.0-bin.zip \
            --output /tmp/gradle-9.6.0-bin.zip
          printf '%s  %s\n' "$GRADLE_SHA" /tmp/gradle-9.6.0-bin.zip | sha256sum --check
          unzip -q /tmp/gradle-9.6.0-bin.zip -d /tmp
          /tmp/gradle-9.6.0/bin/gradle wrapper \
            --gradle-version 9.6.0 \
            --distribution-type bin \
            --gradle-distribution-sha256-sum "$GRADLE_SHA"
          chmod +x gradlew
          printf '%s  %s\n' "$WRAPPER_SHA" gradle/wrapper/gradle-wrapper.jar | sha256sum --check
          grep -Fq 'gradle-9.6.0-bin.zip' gradle/wrapper/gradle-wrapper.properties
          grep -Fq "$GRADLE_SHA" gradle/wrapper/gradle-wrapper.properties
          ./gradlew --version

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace clean assembleDebug
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.mjstudio.videoplayer'"
          if "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$APK" | grep -F 'android.permission.INTERNET'; then
            echo "Offline APK unexpectedly requests INTERNET permission."
            exit 1
          fi
          ls -lh "$APK"

      - name: Smoke test on Android 16 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            set -euo pipefail
            APK="app/build/outputs/apk/debug/app-debug.apk"
            adb install -r "$APK"
            adb shell am force-stop com.mjstudio.videoplayer
            adb shell am start -W -n com.mjstudio.videoplayer/.MainActivity
            sleep 15
            PID="$(adb shell pidof com.mjstudio.videoplayer | tr -d '\r')"
            test -n "$PID"
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | grep -F 'com.mjstudio.videoplayer/.MainActivity'
            APP_LOG="$(adb logcat -d --pid="$PID" -t 3000)"
            if printf '%s' "$APP_LOG" | grep -E 'FATAL EXCEPTION|Process: com\.mjstudio\.videoplayer'; then
              echo "MJ Video Player crashed during the smoke test."
              exit 1
            fi
            echo "App stayed installed, running, and resumed for 15 seconds."

      - name: Upload APK and generated Gradle Wrapper
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MJ-Video-Player-APK-and-Gradle-Wrapper
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            gradlew
            gradlew.bat
            gradle/wrapper/gradle-wrapper.jar
            gradle/wrapper/gradle-wrapper.properties
          if-no-files-found: warn
          retention-days: 14
