name: Build and smoke-test MJ Video Player (separate APK)

on:
  workflow_dispatch:
  push:
    paths:
      - "MJ-Video-Player-source-Gradle-9.6.0-API36.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify and extract source ZIP
        run: |
          set -euo pipefail
          test -f MJ-Video-Player-source-Gradle-9.6.0-API36.zip
          unzip -t MJ-Video-Player-source-Gradle-9.6.0-API36.zip
          mkdir -p app-source
          unzip -q MJ-Video-Player-source-Gradle-9.6.0-API36.zip -d app-source
          test -f app-source/MJ-Video-Player/settings.gradle.kts
          test -f app-source/MJ-Video-Player/app/src/main/AndroidManifest.xml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" "emulator"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Generate and verify Gradle Wrapper
        working-directory: app-source/MJ-Video-Player
        run: |
          set -euo pipefail
          gradle wrapper --gradle-version 9.6.0 --distribution-type bin
          ./gradlew wrapper --gradle-version 9.6.0 --distribution-type bin
          ./gradlew --version
          grep -q "gradle-9.6.0-bin.zip" gradle/wrapper/gradle-wrapper.properties
          test -f gradle/wrapper/gradle-wrapper.jar
          test -x gradlew

      - name: Build debug APK
        working-directory: app-source/MJ-Video-Player
        run: ./gradlew --no-daemon clean assembleDebug

      - name: Enable KVM for Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch on Android 16 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set -euo pipefail
            cd app-source/MJ-Video-Player
            adb wait-for-device
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.mjstudio.videoplayer || true
            adb shell am start -n com.mjstudio.videoplayer/.MainActivity
            sleep 15
            adb shell pidof com.mjstudio.videoplayer
            adb shell dumpsys activity activities | grep -q "com.mjstudio.videoplayer"
            adb logcat -d -t 3000 > smoke-test-logcat.txt

      - name: Upload APK and generated wrapper
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MJ-Video-Player-APK-and-Gradle-Wrapper
          path: |
            app-source/MJ-Video-Player/app/build/outputs/apk/debug/app-debug.apk
            app-source/MJ-Video-Player/gradlew
            app-source/MJ-Video-Player/gradlew.bat
            app-source/MJ-Video-Player/gradle/wrapper/gradle-wrapper.jar
            app-source/MJ-Video-Player/gradle/wrapper/gradle-wrapper.properties
            app-source/MJ-Video-Player/smoke-test-logcat.txt
          if-no-files-found: warn
