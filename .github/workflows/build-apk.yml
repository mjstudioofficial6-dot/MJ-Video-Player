name: Build MJ Video Player APK

on:
  workflow_dispatch:
  push:
    paths:
      - "MJ-Video-Player-source-Gradle-9.6.0-API36.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify and extract source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="MJ-Video-Player-source-Gradle-9.6.0-API36.zip"
          test -f "$ZIP"
          unzip -t "$ZIP"
          mkdir -p app-source
          unzip -q "$ZIP" -d app-source
          PROJECT_DIR="app-source/MJ-Video-Player"
          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/gradle.properties"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/src/main/java/com/mjstudio/videoplayer/MainActivity.kt"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "15859902"
          packages: "platform-tools"

      - name: Install Android API 36 and Build Tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Generate and verify Gradle Wrapper
        working-directory: app-source/MJ-Video-Player
        shell: bash
        run: |
          set -euo pipefail
          gradle wrapper --gradle-version 9.6.0 --distribution-type bin
          ./gradlew wrapper --gradle-version 9.6.0 --distribution-type bin
          ./gradlew --version
          grep -q "gradle-9.6.0-bin.zip" gradle/wrapper/gradle-wrapper.properties
          test -f gradle/wrapper/gradle-wrapper.jar
          test -x gradlew

      - name: Build debug APK
        working-directory: app-source/MJ-Video-Player
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon clean assembleDebug

      - name: Verify APK output
        working-directory: app-source/MJ-Video-Player
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "ERROR: Build finished but no APK was found."
            find app/build/outputs -maxdepth 5 -type f -print || true
            exit 1
          fi
          echo "Verified APK: $APK"
          ls -lh "$APK"

      - name: Upload APK and generated Gradle Wrapper
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MJ-Video-Player-APK-and-Gradle-Wrapper
          path: |
            app-source/MJ-Video-Player/app/build/outputs/apk/**/*.apk
            app-source/MJ-Video-Player/gradlew
            app-source/MJ-Video-Player/gradlew.bat
            app-source/MJ-Video-Player/gradle/wrapper/gradle-wrapper.jar
            app-source/MJ-Video-Player/gradle/wrapper/gradle-wrapper.properties
          if-no-files-found: warn
